[package]
name = "key-keeper"
version = "0.1.0"
description = "Offline personal account vault"
authors = ["Key Keeper contributors"]
edition = "2021"

[lib]
name = "key_keeper"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = { version = "0.10", features = ["zeroize"] }
aes = { version = "0.8", features = ["zeroize"] }
subtle = "2"
argon2 = { version = "0.5", features = ["zeroize"] }
getrandom = "0.2"
zeroize = { version = "1", features = ["derive"] }
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
totp-rs = { version = "5", features = ["otpauth", "zeroize"] }
calamine = "0.31"
encoding_rs = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_RemoteDesktop", "Win32_System_DataExchange", "Win32_System_Power", "Win32_System_LibraryLoader", "Win32_UI_Controls"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
